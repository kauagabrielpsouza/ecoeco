# EcoEco · Robô que atualiza indicadores e notícias a cada 30 minutos (aos minutos 7 e 37)
# Precisa de 3 segredos no GitHub (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BRAPI_TOKEN
name: Atualizar mercado e notícias

on:
  schedule:
    # Minutos "quebrados" de propósito: agendamentos em minuto redondo (0 e 30) caem no horário
    # de pico do GitHub e são atrasados ou descartados. Horário UTC.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

concurrency:
  group: atualizar-dados
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Indicadores (Banco Central, IBGE, B3)
        run: node atualizar-mercado.mjs
      - name: Notícias (RSS)
        if: always()
        run: node atualizar-noticias.mjs
