    else if (id === "min") S.msgDraft = el.value;
    else if (id === "ain") S.argDraft = el.value;
    else if (id === "ept") S.editDraft = el.value;
    else if (id === "q") { if (!S.q.trim() && el.value.trim()) S.stab = "all"; S.q = el.value; render(); }
    else if (id === "dq") { S.debQ = el.value; render(); }
    else if (id === "lq") { S.libF.q = el.value; render(); }
    else if (id === "cq") { S.convQ = el.value; render(); }
    else if (id === "win") S.watchDraft = el.value;
    else if (id === "dcin") S.dcDraft = el.value;
    else if (id.startsWith("argc-")) S.argcDraft[id.slice(5)] = el.value;
    else if (id === "tt") S.topicDraft.title = el.value;
    else if (id === "tx") S.topicDraft.text = el.value;
    else if (id === "trin") S.treplyDraft = el.value;
    else if (id === "acin") S.acDraft = el.value;
    else if (id === "jq") { S.jobF.q = el.value; render(); }
    else if (id === "a-lurl") S.artDraft.lurl = el.value;
    else if (id === "a-ltitle") S.artDraft.ltitle = el.value;
    else if (id.startsWith("attcap-")) { const x = S.artDraft.atts.find((a) => a.key === el.dataset.key); if (x) { x.caption = el.value; saveDraftSoon(); } }
    else if (/^a-(title|summary|body)$/.test(id)) { S.artDraft[id.slice(2)] = el.value; saveDraftSoon(); if (id === "a-body") { S.artDraft.caret = el.selectionStart; const c = $("#a-count"); if (c) c.textContent = wordInfo(el.value); } }
    else if (el.dataset.poll !== undefined && S.poll) S.poll[+el.dataset.poll] = el.value;
    else if (S.chartModal && /^c-/.test(id)) { captureChart(); const p = $("#chartPrev"); if (p) p.innerHTML = chartSvg(S.chartModal.spec()) || '<p class="muted" style="margin:0">A prévia aparece quando houver dados válidos.</p>'; }
  });

  document.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target.id;
    if (f === "composer") {
      const text = S.draft.trim();
      const poll = S.poll ? S.poll.map((o) => o.trim()).filter(Boolean) : null;
      if (S.poll && poll.length < 2) { toast("A votação precisa de pelo menos duas opções."); return; }
      if (!text && !S.att && !S.chart && !poll && !S.shareArticle && !S.shareDebate) { toast("Escreva algo ou adicione um anexo, gráfico ou votação."); return; }
      const body = { author: S.meId, text: text.slice(0, 1000), createdAt: now() };
      if (S.att) body.media = S.att;
      if (S.chart) body.chart = S.chart;
      if (poll) body.poll = { options: poll.slice(0, 4) };
      if (S.shareArticle) body.article = S.shareArticle;
      if (S.shareDebate) body.debate = S.shareDebate;
      if (await write(() => col("posts").add(body), "Publicado")) { S.draft = ""; S.att = null; S.chart = null; S.poll = null; S.shareArticle = null; S.shareDebate = null; render(); }
    } else if (f === "commentForm") {
      const text = S.commentDraft.trim(); if (!text) return;
      const pid = S.view.split(":")[1];
      const body = { post: pid, author: S.meId, text: text.slice(0, 600), createdAt: now() };
      if (S.replyTo) body.parent = S.replyTo;
      if (await write(() => col("comments").add(body), S.replyTo ? "Resposta publicada" : null)) { S.commentDraft = ""; S.replyTo = null; render(); }
    } else if (f === "editPostForm") {
      const el = $("#ept"); const text = (el ? el.value : S.editDraft).trim();
      const p = S.posts.find((x) => x.id === S.editing);
      if (!p) { S.editing = null; render(); return; }
      if (!text && !p.media && !p.chart && !p.poll) { toast("A publicação não pode ficar vazia."); return; }
      if (text === (p.text || "")) { S.editing = null; render(); return; }
      if (await write(() => col("posts").doc(p.id).update({ text: text.slice(0, 1000), editedAt: now() }), "Publicação editada")) { S.editing = null; render(); }
    } else if (f === "pwForm") {
      const p1 = ($("#pw1") || {}).value || "", p2 = ($("#pw2") || {}).value || "";
      if (p1.length < 8) { toast("A senha precisa ter pelo menos 8 caracteres."); return; }
      if (p1 !== p2) { toast("As senhas não são iguais."); return; }
      try { await window.EcoBackend.changePassword(p1); toast("Senha alterada."); $("#pw1").value = ""; $("#pw2").value = ""; } catch (e) { toast("Não foi possível trocar a senha agora."); }
    } else if (f === "watchForm") {
      const t2 = (S.watchDraft || "").trim().toUpperCase().replace(/^\$/, "");
      if (!/^[A-Z]{4}\d{1,2}$/.test(t2)) { toast("Use o código da B3, como PETR4, VALE3 ou BOVA11."); return; }
      if (!watchList().includes(t2)) await saveState({ watch: watchList().concat(t2).slice(0, 30) });
      S.watchDraft = ""; render(); toast("$" + t2 + " adicionado à sua lista");
    } else if (f === "invForm") {
      const code = (($("#adm-code") || {}).value || "").trim().toUpperCase(), max = parseInt(($("#adm-max") || {}).value, 10);
      if (!/^[A-Z0-9-]{4,30}$/.test(code)) { toast("O código deve ter de 4 a 30 letras, números ou hífen (sem espaço nem acento)."); const el = $("#adm-code"); if (el) el.focus(); return; }
      if (!(max >= 1 && max <= 10000)) { toast("O limite de usos deve ser de 1 a 10000."); return; }
      await admCall("admin_create_invite", { p_code: code, p_max_uses: max }, "Convite " + code + " criado.", "invites");
    } else if (f === "genForm") {
      await submitForm();
    } else if (f === "topicForm") {
      const title = S.topicDraft.title.trim(), text = S.topicDraft.text.trim(); const cid = S.view.split(":")[1];
      if (!title) { toast("Dê um título ao tópico."); return; }
      if (await write(() => col("topics").add({ comm: cid, author: S.meId, title: title.slice(0, 120), text: text.slice(0, 2000), createdAt: now() }), "Tópico aberto")) { S.topicDraft = { title: "", text: "" }; render(); }
    } else if (f === "treplyForm") {
      const text = S.treplyDraft.trim(); if (!text) return;
      if (await write(() => col("topicReplies").add({ topic: S.view.split(":")[1], author: S.meId, text: text.slice(0, 1500), createdAt: now() }))) { S.treplyDraft = ""; render(); }
    } else if (f === "acForm") {
      const text = S.acDraft.trim(); if (!text) return;
      if (await write(() => col("articleComments").add({ article: S.view.split(":")[1], author: S.meId, text: text.slice(0, 1000), createdAt: now() }))) { S.acDraft = ""; render(); }
    } else if (f === "artForm") {
      const ae = document.activeElement;
      if (ae && (ae.id === "a-lurl" || ae.id === "a-ltitle")) { addArtLink(); return; }   // Enter no campo do link
      if (ae && ae.id && ae.id.startsWith("attcap-")) return;
      await publishArt();
    } else if (f === "msgForm") {
      const text = S.msgDraft.trim(); if (!text) return;
      const to = S.view.split(":")[1];
      if (await write(() => col("messages").add({ from: S.meId, to, text: text.slice(0, 1000), createdAt: now() }))) { S.msgDraft = ""; render(); }
    } else if (f === "argForm") {
      const did = S.view.split(":")[1]; const my = myVote(did); const pos = S.argSide || (my && my.side); const text = S.argDraft.trim();
      if (!pos) { toast("Escolha sua posição: um dos lados ou “Depende”."); return; }
      if (!text) { toast("Escreva seu argumento."); return; }
      const ok = await write(async () => {
        await col("args").add({ debate: did, side: pos, author: S.meId, text: text.slice(0, 800), createdAt: now() });
        if (pos === "A" || pos === "B") { if (!my || my.side !== pos) await col("votes").doc(my ? my.id : did + "__" + S.meId).set({ debate: did, side: pos, user: S.meId, createdAt: now() }); }
      }, "Argumento publicado");
      if (ok) { S.argDraft = ""; S.argSide = null; S.argFilter = "all"; render(); }
    } else if (f === "dcForm") {
      const text = S.dcDraft.trim(); if (!text) return;
      if (await write(() => col("debateComments").add({ debate: S.view.split(":")[1], author: S.meId, text: text.slice(0, 1000), createdAt: now() }), "Resposta publicada")) { S.dcDraft = ""; render(); }
    } else if (ev.target.classList && ev.target.classList.contains("argcform")) {
      const aid = ev.target.dataset.arg; const text = (S.argcDraft[aid] || "").trim(); if (!text) return;
      if (await write(() => col("argComments").add({ arg: aid, author: S.meId, text: text.slice(0, 600), createdAt: now() }))) { S.argcDraft[aid] = ""; render(); const el = document.getElementById("argc-" + aid); if (el) el.focus(); }
    } else if (f === "chartForm") {
      captureChart();
      const spec = S.chartModal.spec();
      if (spec.values.length < 2) { toast("Coloque pelo menos dois valores, um por linha (rótulo; valor)."); return; }
      if (!spec.title) spec.title = "Gráfico";
      S.chart = spec; S.chartModal = null; render();
    } else if (f === "onbForm") {
      captureOnb();
      const o = S.onb; if (!o.name.trim()) { toast("Escreva seu nome."); return; }
      const un = cleanUser(o.username);
      if (userTaken(un)) { toast("Esse nome de usuário já está em uso."); return; }
      const [bg] = hueOf(S.meId); const hue = HUES.findIndex((h) => h[0] === bg);
      if (await write(() => col("users").doc(S.meId).set({ name: o.name.trim().slice(0, 60), username: un, headline: o.headline.trim().slice(0, 80), photo: o.photo || "", cover: "", bio: "", role: "", school: "", city: "", link: "", education: "", experience: "", hue: hue < 0 ? 0 : hue, fake: false, createdAt: now() }), "Perfil criado. Bem-vindo(a)!")) { S.onb = null; S.onb2 = { comms: [], follow: [] }; render(); renderModal(); }
    } else if (f === "editForm") {
      captureEdit();
      const e = S.edit; if (!e.name.trim()) { toast("O nome não pode ficar vazio."); return; }
      const un = cleanUser(e.username);
      if (userTaken(un)) { toast("Esse nome de usuário já está em uso."); return; }
      const body = { name: e.name.trim().slice(0, 60), username: un, headline: e.headline.trim(), bio: e.bio.trim(), role: e.role.trim(), school: e.school.trim(), city: e.city.trim(), link: e.link.trim(), education: e.education.trim(), experience: e.experience.trim(), photo: e.photo || "", cover: e.cover || "" };
      if (await write(() => col("users").doc(S.meId).update(body), "Perfil atualizado")) { S.edit = null; render(); }
    } else if (f === "repForm") {
      const r = document.querySelector('input[name="reason"]:checked');
      const pid = S.report;
      if (await write(() => col("reports").add({ post: pid, by: S.meId, reason: REASONS[r ? +r.value : 0], createdAt: now(), status: "pendente" }), "Denúncia enviada. A moderação vai analisar.")) { S.report = null; renderModal(); }
    }
  });

  const trackCaret = (ev) => { if (ev.target && ev.target.id === "a-body") S.artDraft.caret = ev.target.selectionStart; };
  document.addEventListener("keyup", trackCaret);
  document.addEventListener("mouseup", trackCaret);
  document.addEventListener("select", trackCaret, true);
  document.addEventListener("focusout", trackCaret);   // ao clicar em "Inserir no texto", o campo perde o foco: guarda onde estava o cursor
  document.addEventListener("selectionchange", () => { const a = document.activeElement; if (a && a.id === "a-body") S.artDraft.caret = a.selectionStart; });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && $("#lightbox")) { closeLightbox(); return; }
    if (ev.key === "Escape" && S.bell) { closeBell(true); return; }
    if (ev.key === "Escape" && S.acct) { S.acct = false; renderNav(); $("#mecard").focus(); return; }
    if (ev.key === "Escape") { if (S.edit || S.report || S.chartModal || S.form || S.blockAsk) { S.edit = null; S.report = null; S.chartModal = null; S.form = null; S.blockAsk = null; renderModal(); } else if (S.menu || S.dataMenu) { S.menu = null; S.dataMenu = false; render(); } }
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && ev.target.id === "comp") { $("#composer").requestSubmit(); }
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

  /* ---------- boot ---------- */
  applyStaticI18n();
  applyCompact();
  render();
  setInterval(() => { if (!S.signedOut && (!document.activeElement || !["comp", "cin", "min", "ain", "q"].includes(document.activeElement.id))) renderNav(); }, 60000);

  (async function boot() {
    const claude = window.claude;
    if (!claude || !claude.use) { render(); return; }
    const [user, db, assets] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("assets")]);
    S.assets = assets;
    if (user) {
      const me = await user.me();
      S.meId = me.id; S.meName = me.name || "";
      const cw = await user.can("data.write");
      if (cw === false) S.canWrite = false;
      S.sanction = window.EcoBackend && window.EcoBackend.mySanction ? window.EcoBackend.mySanction() : null;
      if (S.sanction) S.canWrite = false;
      try { S.isAdmin = !!(await user.canEdit()); } catch (e) {}
    }
    S.db = db;
    if (!db) { render(); return; }
    if (S.meId) {
      db.collection("data/users/" + S.meId).onSnapshot((snap) => { const all = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.savedAll = all; S.pstate = all.find((x) => x.id === "state") || {}; if (S.pstate.lang && S.pstate.lang !== L.lang) { L.setLang(S.pstate.lang); applyStaticI18n(); renderModal(); } S.saved = all.filter((x) => x.post); S.savedJobs = all.filter((x) => x.job); render(); }, () => {});
    }
    ["users", "posts", "likes", "reposts", "comments", "follows", "votes", "args", "ups", "messages", "pollVotes", "commentLikes", "communities", "members", "topics", "topicReplies", "articles", "articleLikes", "articleComments", "jobs", "events", "rsvps", "debates", "debateComments", "argComments", "blocks", "library", "reports"].forEach((c) => {
      db.collection(c).onSnapshot((snap) => {
        const arr = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        if (c === "users") { const m = {}; arr.forEach((u) => { m[u.id] = u; }); S.users = m; }
        else if (c === "blocks") { S.blocks = arr; applyBlocks(); }
        else { S.raw[c] = arr; S[c] = filterBlocked(c, arr); }
        if (c === "votes" || c === "members") loadStatsSoon();
        if (c === "users" && S.meId && S.canWrite && !S.signedOut && !S.users[S.meId] && !S.onb && !snap.metadata.fromCache) { S.onb = { name: S.meName, username: cleanUser(S.meName), headline: "", photo: "" }; renderModal(); }
        if (c === "users" && S.users[S.meId] && S.onb) { S.onb = null; renderModal(); }
        render();
      }, (e) => { if (e && e.code === "revoked") { S.db = null; render(); } });
    });
  })();
})();
</script>

</body>
</html>
